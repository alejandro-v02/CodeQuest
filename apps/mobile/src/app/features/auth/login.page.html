<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-shell">
    <div class="auth-hero">
      <div class="brand-row">
        <img src="assets/branding/logo-mark.png" alt="" class="brand-mark" />
        <p class="brand">CodeQuest</p>
      </div>
      <h1>Bienvenido de vuelta</h1>
      <p class="subtitle">Sigue tu racha donde la dejaste.</p>
    </div>

    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <ion-input
        label="Correo"
        labelPlacement="stacked"
        type="email"
        inputmode="email"
        formControlName="email"
        placeholder="tu@correo.com"
        fill="outline"
      ></ion-input>

      <ion-input
        label="Contraseña"
        labelPlacement="stacked"
        type="password"
        formControlName="password"
        placeholder="••••••••"
        fill="outline"
      ></ion-input>

      @if (errorMessage(); as message) {
        <p class="error-message">{{ message }}</p>
      }

      <ion-button expand="block" type="submit" [disabled]="form.invalid || isSubmitting()">
        Iniciar sesión
      </ion-button>

      <div class="divider"><span>o</span></div>

      <ion-button expand="block" fill="outline" type="button" (click)="continueWithGithub()">
        <ion-icon name="logo-github" slot="start"></ion-icon>
        Continuar con GitHub
      </ion-button>

      <p class="switch-link">
        ¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a>
      </p>

      @if (isSubmitting()) {
        <div class="auth-card-overlay">
          <app-loading-wave />
        </div>
      }
    </form>
  </div>
</ion-content>
