<div class="heatmap" role="img" [attr.aria-label]="'heatmap.ariaLabel' | translate">
  @for (week of weeks(); track $index) {
    <div class="heatmap-column">
      @for (day of week; track day.date) {
        <div class="day-cell" [class]="'level-' + day.level" [title]="day.date + ': ' + day.count"></div>
      }
    </div>
  }
</div>
