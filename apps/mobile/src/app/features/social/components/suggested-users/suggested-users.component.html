@if (suggestions().length > 0) {
  <section class="suggestions">
    <h3 class="suggestions-title">{{ 'suggestedUsers.heading' | translate }}</h3>
    <div class="suggestions-row">
      @for (user of suggestions(); track user.userId) {
        <app-user-result-row
          [user]="user"
          variant="card"
          (changed)="onChanged($event)"
        ></app-user-result-row>
      }
    </div>
  </section>
}
