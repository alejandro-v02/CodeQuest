<ion-modal
  class="settings-modal"
  [isOpen]="isOpen()"
  [breakpoints]="[0, 0.62, 0.92]"
  [initialBreakpoint]="0.62"
  (willDismiss)="closed.emit()"
>
  <ng-template>
    <ion-content class="settings-modal-content">
      <div class="modal-handle"></div>
      <p class="eyebrow">{{ 'common.settings' | translate }}</p>
      <h1>{{ 'profile.settingsHeading' | translate }}</h1>

      <div class="group">
        <div class="row">
          <span class="row-icon"><ion-icon name="globe-outline"></ion-icon></span>
          <span class="row-label">{{ 'profile.appLanguageLabel' | translate }}</span>
          <div class="language-switch">
            <button
              type="button"
              class="language-option"
              [class.selected]="i18n.language() === 'es'"
              (click)="setAppLanguage('es')"
            >
              {{ 'profile.languageSpanish' | translate }}
            </button>
            <button
              type="button"
              class="language-option"
              [class.selected]="i18n.language() === 'en'"
              (click)="setAppLanguage('en')"
            >
              {{ 'profile.languageEnglish' | translate }}
            </button>
          </div>
        </div>

        <div class="row">
          <span class="row-icon"><ion-icon name="notifications-outline"></ion-icon></span>
          <span class="row-label">{{ 'profile.dailyReminderLabel' | translate }}</span>
          <ion-toggle
            [checked]="reminderEnabled()"
            (ionChange)="toggleReminder($event.detail.checked)"
          ></ion-toggle>
        </div>
      </div>

      @if (errorMessage(); as message) {
        <p class="error-message">{{ message }}</p>
      }

      <div class="group">
        <button type="button" class="row action-row" (click)="openAdmin()">
          <span class="row-icon"><ion-icon name="stats-chart-outline"></ion-icon></span>
          <span class="row-label">{{ 'profile.adminPanelButton' | translate }}</span>
          <ion-icon class="chevron" name="chevron-forward"></ion-icon>
        </button>
      </div>

      <ion-button expand="block" fill="outline" color="danger" class="logout-button" (click)="logout()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        {{ 'profile.logoutButton' | translate }}
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
