<app-page-header title="Perfil"></app-page-header>

<ion-content [fullscreen]="true">
  @if (user(); as u) {
    <div class="profile-card">
      <div class="avatar">{{ u.displayName.charAt(0).toUpperCase() }}</div>
      <h2>{{ u.displayName }}</h2>
      <p class="email">{{ u.email }}</p>

      <dl class="details">
        <div class="row">
          <dt>Lenguaje</dt>
          <dd>{{ u.preferredLanguage ?? '—' }}</dd>
        </div>
        <div class="row">
          <dt>Meta diaria</dt>
          <dd>{{ u.dailyGoalMinutes ? u.dailyGoalMinutes + ' min' : '—' }}</dd>
        </div>
      </dl>

      <div class="toggle-row">
        <ion-icon name="notifications-outline"></ion-icon>
        <span class="toggle-label">Recordatorio diario</span>
        <ion-toggle
          [checked]="reminderEnabled()"
          (ionChange)="toggleReminder($event.detail.checked)"
        ></ion-toggle>
      </div>

      <button type="button" class="admin-link" (click)="openAdmin()">Panel de administración</button>

      <ion-button expand="block" fill="outline" color="danger" (click)="logout()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Cerrar sesión
      </ion-button>
    </div>
  }
</ion-content>
